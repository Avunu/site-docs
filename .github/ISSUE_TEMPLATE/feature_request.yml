name: Feature request
description: Suggest a change to the docs site or its build.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the documentation you want to write or publish, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: checkboxes
    id: scope
    attributes:
      label: Does it touch the public surface?
      description: Page addresses (docs.avunu.net/<path>/...), projects.json keys, CLI commands and options, and the inputs of the check-docs workflow are what projects depend on.
      options:
        - label: I think it would be a breaking change for existing projects or links
