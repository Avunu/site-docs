name: Bug report
description: Something on docs.avunu.net, in the build or in a workflow does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The build or check (node build/cli.js)
        - A workflow (deploy, bump, check a project)
        - The built site (layout, styling, search, switcher)
        - A project's documentation (say which project and page)
        - Documentation of this repository
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or workflow run
      description: The address of the page (https://docs.avunu.net/...) or the link of the workflow run.
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: For a local build, the Node version and the package manager, for example "Node 24.21, npm 11.19".
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Paste the build output if there is any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
