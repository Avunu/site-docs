name: Bump projects

# Keeps the submodule pointers of the documentation workspace current. Every 30 minutes (and by hand) it
# runs scripts/bump-submodules.mjs, which moves each project to its latest non-prerelease GitHub Release
# (a project with no release is pinned to the head of its default branch until it has one). When anything
# moved, it pushes the branch `bump/projects`, opens or updates the ONE pull request
# `chore(docs): bump N project(s)` (each project listed, old to new, with a compare link), makes sure CI
# runs on it and turns on auto-merge. No secret lives in the project repositories: this is a pull
# workflow, and this repository is the only one that holds a credential.
#
# The branch is rebuilt from the default branch on every run (force-pushed with a lease, only ever this
# branch), so the pull request always equals "the default branch plus every bump still pending". A manual
# run with `project` bumps only that project: the pull request then holds only it until the next
# scheduled run adds the others again. When a run finds nothing left to bump and no lookup failed, the
# open bump pull request is closed (it has nothing left to merge).
#
# The token. Set the secret BUMP_TOKEN (a fine-grained personal access token or a GitHub App token, for
# THIS repository only, with Contents: write, Pull requests: write and Actions: write). Without it the run
# falls back to GITHUB_TOKEN and says so, with two limits GitHub imposes on that token: a pull request it
# opens starts no pull request workflows, so ci.yml is dispatched on the branch instead (a dispatched run
# reports its checks on the branch head, the same way release.yml does for release-please), and the merge
# GitHub performs for auto-merge starts no push workflow, so deploy.yml does not run by itself after a
# bump: run it by hand. BUMP_TOKEN has neither limit, so with it ci.yml starts from the pull request itself
# and is not dispatched a second time.
#
# Auto-merge needs the repository setting "Allow auto-merge" and a rule on the default branch that
# requires the `ci` check; without them the pull request simply waits for a person.
#
# GitHub disables scheduled workflows of a repository with no activity (no commit) for 60 days. A merged
# bump is a commit, so a busy workspace never goes quiet; after a long quiet spell, re-enable this
# workflow on the Actions tab (or run it by hand, which does not re-enable the schedule).
on:
  schedule:
    - cron: "7,37 * * * *" # off the hour and half hour, when GitHub's scheduler is busiest
  workflow_dispatch:
    inputs:
      project:
        description: Bump only this project (its path in projects.json, such as frappe-nix); empty bumps all.
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the submodules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the branch bump/projects (the fallback token; BUMP_TOKEN has its own scopes)
      pull-requests: write # open, update and close the pull request, turn on auto-merge
      actions: write # dispatch ci.yml on the branch when the pull request was opened with GITHUB_TOKEN
    env:
      BRANCH: bump/projects
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # No submodules: the gitlinks are in the tree, and the script needs nothing else.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Reads releases and tags of public repositories, and changes only the index of this checkout.
      - name: Resolve the target commit of every project
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
        run: |
          args=(--json "$RUNNER_TEMP/bump.json" --summary "$RUNNER_TEMP/bump.md")
          if [ -n "$PROJECT" ]; then
            if ! [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error title=project::expected a path such as frappe-nix, got '$PROJECT'"
              exit 1
            fi
            args+=(--project "$PROJECT")
          fi
          node scripts/bump-submodules.mjs "${args[@]}"
          {
            echo "count=$(jq '.changed | length' "$RUNNER_TEMP/bump.json")"
            echo "skipped=$(jq '.skipped | length' "$RUNNER_TEMP/bump.json")"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/bump.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push the branch and open or update the pull request
        if: ${{ steps.resolve.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWN_TOKEN: ${{ secrets.BUMP_TOKEN != '' }}
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/bump.json"
          count="$(jq '.changed | length' "$report")"
          title="chore(docs): bump $count project(s)"

          if [ "$OWN_TOKEN" != "true" ]; then
            echo "::notice title=BUMP_TOKEN::BUMP_TOKEN is not set, so GITHUB_TOKEN is used. The pull request will start no workflow by itself: ci.yml is dispatched on the branch instead, and deploy.yml must be run by hand after the merge. Add the secret to avoid both (see the operations guide)."
          fi

          if git diff --cached --quiet -- projects; then
            echo "::error title=bump::the report lists $count change(s) but nothing is staged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          {
            printf '%s\n\n' "$title"
            jq -r '.changed[] | "- \(.path): \(.fromTag // .from[0:7]) -> \(.toTag // .to[0:7])"' "$report" | cut -c1-100
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit --quiet --file "$RUNNER_TEMP/commit-message.txt"

          # The checkout kept no credentials (persist-credentials: false), so this one push is
          # authenticated the way actions/checkout does it, through the environment rather than a
          # command line. The lease names the value this run saw: a branch somebody else moved since is
          # not overwritten, and a branch that does not exist yet must still not exist.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          remote="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          git push --force-with-lease="refs/heads/$BRANCH:$remote" origin "HEAD:refs/heads/$BRANCH"

          body="$RUNNER_TEMP/pr-body.md"
          {
            cat "$RUNNER_TEMP/bump.md"
            printf '\nKept up to date by the [Bump projects](%s/%s/actions/runs/%s) workflow.\n' \
              "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID"
          } > "$body"
          # `gh pr edit` reads project cards, which GITHUB_TOKEN may not: the REST call does not.
          find_pr() {
            gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty'
          }
          number="$(find_pr)"
          if [ -n "$number" ]; then
            gh api --method PATCH "repos/$GH_REPO/pulls/$number" --raw-field title="$title" --field body=@"$body" > /dev/null
            echo "updated pull request #$number"
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "$title" --body-file "$body"
            number="$(find_pr)"
          fi

          # A pull request opened with GITHUB_TOKEN starts no pull_request workflows; a dispatched run does
          # start, and its checks attach to the branch head. With BUMP_TOKEN the pull request starts its own.
          if [ "$OWN_TOKEN" != "true" ]; then
            gh workflow run ci.yml --ref "$BRANCH"
          fi
          gh pr merge "$number" --auto --squash || echo "::warning title=auto-merge::could not turn on auto-merge for #$number: allow auto-merge in the repository settings; a person can merge the pull request meanwhile"

      - name: Close the pull request when nothing is left to bump
        if: ${{ steps.resolve.outputs.count == '0' && steps.resolve.outputs.skipped == '0' && inputs.project == '' }}
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          number="$(gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr close "$number" --comment "Every project is already at its target commit on $DEFAULT_BRANCH, so there is nothing left to merge. The next bump opens a new pull request."
          fi
