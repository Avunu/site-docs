version: 2

# Updates arrive as pull requests that a person merges after `ci` is green. The commit type says whether
# the update ships in a release of the shared check (release.yml): the build's own dependencies, Jx and
# yaml, are `fix(deps)`, because they change what check-docs.yml checks in every project, so each makes
# a patch release; development tooling, the browser suites and GitHub Actions are `chore(deps-dev)`,
# `chore(deps)` and `ci(deps)`, which make none.
#
# The update chain for Jx: Dependabot's `jx` group here -> the whole `ci` workflow, including the
# real-Jx integration tests and the Chrome suites -> a person merges -> deploy.yml publishes the site.
# jx-latest.yml is the early warning for a release Dependabot has not proposed yet.
#
# The documentation submodules (projects/*) are not Dependabot's: bump.yml moves them to each project's
# latest release.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["@jxsuite/*"] # Avunu's own framework: a fix should reach the site within days, not weeks
    groups:
      jx:
        patterns: ["@jxsuite/*"]
      runtime:
        dependency-type: production
        patterns: ["yaml"]
      tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # The types follow the Node floor (22.19) the build supports, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # The browser suites (verify/): Playwright and axe, run by the `verify` job of ci.yml.
  - package-ecosystem: npm
    directory: /verify
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      browser-suites:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
