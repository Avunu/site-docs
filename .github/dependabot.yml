version: 2

# Updates arrive as pull requests that a person merges after `ci` is green. Nothing here is released or
# published as a package, so every update is a `chore(deps)` or `ci(deps)`: the commit types say what
# kind of change it is, not what version it makes.
#
# The update chain for Jx: Dependabot's `jx` group here -> the whole `ci` workflow, including the
# real-Jx integration tests and the Chrome suites -> a person merges -> deploy.yml publishes the site.
# jx-latest.yml is the early warning for a release Dependabot has not proposed yet.
#
# The documentation submodules (projects/*) are not Dependabot's: bump.yml moves them to each project's
# latest release.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["@jxsuite/*"] # Avunu's own framework: a fix should reach the site within days, not weeks
    groups:
      jx:
        patterns: ["@jxsuite/*"]
      runtime:
        dependency-type: production
        patterns: ["yaml"]
      tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # The types follow the Node floor (22.19) the build supports, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  # The browser suites (verify/): Playwright and axe, run by the `verify` job of ci.yml.
  - package-ecosystem: npm
    directory: /verify
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      browser-suites:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
